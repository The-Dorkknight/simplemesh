name: Bug report
description: Something in SimpleMesh does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SimpleMesh version
      description: Shown at the bottom of the View pop-up and in the status bar (e.g. 0.5.0-wip). Easiest of all - press More tools > Report a problem in SimpleMesh and paste what it copied
    validations: {required: true}
  - type: input
    id: blender
    attributes:
      label: Blender version and how it was installed
      description: Help ▸ About, plus apt / snap / flatpak / download
    validations: {required: true}
  - type: input
    id: os
    attributes:
      label: Operating system
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: textarea
    id: log
    attributes:
      label: Error text
      description: Window ▸ Toggle System Console (Windows) or start Blender from a terminal and paste what it printed. Say what size the STL is (mm) and whether it is closed (Check button).
